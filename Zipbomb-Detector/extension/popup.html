<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIP Bomb Detector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3e;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --accent:    #6366f1;
      --accent-h:  #818cf8;
      --none:      #22c55e;
      --low:       #84cc16;
      --medium:    #eab308;
      --high:      #f97316;
      --critical:  #ef4444;
    }

    body {
      width: 400px;
      min-height: 200px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    header svg { flex-shrink: 0; }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
    header span { color: var(--muted); font-size: 11px; margin-left: auto; }

    /* Policy bar */
    .policy-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .policy-bar label { color: var(--muted); font-size: 11px; }
    .policy-bar select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Drop zone */
    #drop-zone {
      margin: 14px 16px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #drop-zone:hover, #drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(99,102,241,0.06);
    }
    #drop-zone svg { color: var(--muted); margin-bottom: 8px; }
    #drop-zone p   { color: var(--muted); line-height: 1.5; }
    #drop-zone p strong { color: var(--text); }
    #drop-zone input { display: none; }

    /* Result card */
    #result {
      display: none;
      margin: 0 16px 14px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 14px;
    }
    .threat-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }
    .stat {
      background: var(--surface);
      padding: 10px 14px;
    }
    .stat .label { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .stat .value { font-size: 13px; font-weight: 500; }

    .flags-section {
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .flags-section .flags-title {
      padding: 8px 14px 4px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .flag-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 5px 14px;
      font-size: 12px;
      line-height: 1.4;
    }
    .flag-badge {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      margin-top: 1px;
      text-transform: uppercase;
    }

    .entries-section {
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .entries-title {
      padding: 8px 14px 4px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .entries-title button {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }
    .entries-title button:hover { color: var(--accent-h); }
    .entry-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .entry-table th {
      text-align: left;
      padding: 3px 14px;
      color: var(--muted);
      font-weight: 500;
    }
    .entry-table td {
      padding: 3px 14px;
      border-top: 1px solid var(--border);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .entry-table tr.flagged td { color: var(--critical); }
    .entries-collapsed .entry-table { display: none; }

    .rescan-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 0 16px 14px;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .rescan-btn:hover { border-color: var(--accent); color: var(--text); }

    #spinner {
      display: none;
      text-align: center;
      padding: 28px;
      color: var(--muted);
    }
    .spin {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Threat colors */
    .level-NONE     { color: var(--none);     }
    .level-LOW      { color: var(--low);      }
    .level-MEDIUM   { color: var(--medium);   }
    .level-HIGH     { color: var(--high);     }
    .level-CRITICAL { color: var(--critical); }
    .dot-NONE       { background: var(--none);     }
    .dot-LOW        { background: var(--low);      }
    .dot-MEDIUM     { background: var(--medium);   }
    .dot-HIGH       { background: var(--high);     }
    .dot-CRITICAL   { background: var(--critical); }
    .badge-NONE     { background: rgba(34,197,94,0.15);  color: var(--none);     }
    .badge-LOW      { background: rgba(132,204,22,0.15); color: var(--low);      }
    .badge-MEDIUM   { background: rgba(234,179,8,0.15);  color: var(--medium);   }
    .badge-HIGH     { background: rgba(249,115,22,0.15); color: var(--high);     }
    .badge-CRITICAL { background: rgba(239,68,68,0.15);  color: var(--critical); }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="12" y1="11" x2="12" y2="17"/>
    <line x1="9" y1="14" x2="15" y2="14"/>
  </svg>
  <h1>ZIP Bomb Detector</h1>
  <span>v1.0</span>
</header>

<div class="policy-bar">
  <label for="policy-select">Policy:</label>
  <select id="policy-select">
    <option value="default">Default (100:1)</option>
    <option value="strict">Strict (50:1)</option>
    <option value="paranoid">Paranoid (10:1)</option>
    <option value="relaxed">Relaxed (500:1)</option>
  </select>
</div>

<div id="drop-zone">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
  <p><strong>Drop an archive here</strong><br>ZIP · GZip · BZip2 · TAR · 7z · XZ · RAR · Zstd · PyTorch<br><small style="font-size:11px">or click to browse</small></p>
  <input type="file" id="file-input" accept=".zip,.gz,.bz2,.tar,.7z,.xz,.rar,.zst,.zstd,.tgz,.tbz2,.jar,.war,.apk,.docx,.xlsx,.pptx,.pt,.pth">
</div>

<div id="spinner">
  <div class="spin"></div>
  <p>Analysing…</p>
</div>

<div id="result"></div>

<button class="rescan-btn" id="rescan-btn" style="display:none">← Scan another file</button>

<script src="popup.js" type="module"></script>
</body>
</html>
