[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name        = "pickle-scanner"
version     = "1.0.0"
description = "Static analysis of pickle opcodes to find unsafe deserialization"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

# Only the `scanner` package is published. The top-level scan.py CLI and
# scripts/ are development entry points and are deliberately left out so an
# install cannot shadow unrelated top-level modules.
[tool.setuptools]
packages = ["scanner"]
