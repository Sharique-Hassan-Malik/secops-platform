[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secops"
version = "1.0.0"
description = "Scanners, monitors and red-team simulators reporting into one security pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# The platform is stdlib-only, which is what lets `secops scan` run on a host
# with none of the sensor dependencies installed.
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.24", "pillow>=9", "scipy>=1.10", "scikit-learn>=1.3"]
siem = ["fastapi>=0.100", "sqlalchemy>=2.0", "uvicorn>=0.23"]
full = [
    "numpy>=1.24", "pillow>=9", "scipy>=1.10", "scikit-learn>=1.3",
    "fastapi>=0.100", "sqlalchemy>=2.0", "uvicorn>=0.23",
]
dev = ["pytest>=7"]

[project.scripts]
secops = "secops.cli:main"

[tool.setuptools.packages.find]
include = ["secops*"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
python_files = ["test_*.py"]
# importlib import mode: several modules ship their own `tests` package, and
# the default prepend mode resolves them all to one top-level name, so
# collecting them in a single run collides. Each module's own
# `pytest` still works unchanged from its own folder.
addopts = "-q --import-mode=importlib"
